schema_version: "1.0"

extension:
  id: kivori-gates
  name: "Kivori Quality Gates"
  version: "1.0.0"
  description: "Fail-closed Spec Kit gates for Kivori: implementation preflight, task-integrity audit, full validation, evidence audit, and release gate"
  author: Kivori
  license: UNLICENSED
  category: "quality"
  # Every command only inspects and runs existing project checks; none mutates spec artifacts. The release
  # gate may commit/push, but only when the invoking request already granted that permission.
  effect: read-only

requires:
  # Hooks for before/after implement, tasks, and converge are read by the core command templates shipped
  # from 0.13.0 onward (verified in core_pack/commands/{implement,tasks,converge}.md).
  speckit_version: ">=0.13.0"
  tools:
    - name: git
      required: true
    - name: cargo
      required: true
    - name: pnpm
      required: false
    - name: wokwi-cli
      required: false

provides:
  commands:
    # Command names MUST match `speckit.{extension-id}.{command}`: the installer rejects any other
    # namespace (specify_cli/extensions/__init__.py, "must use extension namespace").
    - name: speckit.kivori-gates.preflight
      file: commands/speckit.kivori-gates.preflight.md
      description: "Read-only implementation preflight: artifacts, task integrity, credential/evidence hygiene, and hardware-fact honesty"
    - name: speckit.kivori-gates.task-audit
      file: commands/speckit.kivori-gates.task-audit.md
      description: "Validate tasks.md integrity: IDs, ordering, evidence references, and simulation-vs-physical separation"
    - name: speckit.kivori-gates.verify
      file: commands/speckit.kivori-gates.verify.md
      description: "Mandatory post-implementation validation gate across Rust, firmware, frontend, guards, and simulation tooling"
    - name: speckit.kivori-gates.evidence-audit
      file: commands/speckit.kivori-gates.evidence-audit.md
      description: "Verify each checked task's evidence is sufficient and that simulation is never cited as physical proof"
    - name: speckit.kivori-gates.release-gate
      file: commands/speckit.kivori-gates.release-gate.md
      description: "Post-convergence release safety: tree, staged content, secrets, tags, and remote reconciliation"

  config:
    - name: "kivori-gates.yml"
      template: "config-template.yml"
      description: "Which validation groups the verify gate runs, and how strict each gate is"
      required: false

# Only events the installed core command templates actually read. `condition` is deliberately never used:
# implement.md skips any hook with a non-empty condition and defers evaluation to HookExecutor.
hooks:
  after_tasks:
    command: speckit.kivori-gates.task-audit
    optional: false
    priority: 5
    description: "Mandatory task-integrity audit"
  before_implement:
    command: speckit.kivori-gates.preflight
    optional: false
    priority: 5
    description: "Mandatory implementation preflight"
  after_implement:
    command: speckit.kivori-gates.verify
    optional: false
    priority: 5
    description: "Mandatory full validation gate"
  before_converge:
    command: speckit.kivori-gates.evidence-audit
    optional: false
    priority: 5
    description: "Mandatory evidence audit before convergence"
  after_converge:
    command: speckit.kivori-gates.release-gate
    optional: false
    priority: 5
    description: "Mandatory release safety gate after convergence"

tags:
  - "quality"
  - "validation"
  - "embedded"
  - "evidence"

config:
  defaults:
    # Groups the verify gate runs. Turning one off must be a deliberate, reviewed change.
    run_rust: true
    run_firmware: true
    run_frontend: true
    run_guards: true
    run_simulation_tooling: true
    # Authenticated Wokwi runs are opt-in and never read .env.
    allow_authenticated_wokwi: false
