# Kivori Quality Gates configuration.
#
# Copied to `.specify/kivori-gates.yml` on install. Every value defaults to the safe setting; turning a
# group off is a deliberate, reviewable change, and the verify gate must report a disabled group as an
# explicit skip with its reason rather than passing quietly.
#
# This file must never contain a credential. The gates read `WOKWI_CLI_TOKEN` from the inherited process
# environment only — never from this file and never from `.env`.

# Validation groups the verify gate runs.
run_rust: true # cargo fmt, clippy -D warnings, workspace tests
run_firmware: true # riscv builds, every feature configuration, host-sim suites
run_frontend: true # typecheck, lint, tests, build, prettier
run_guards: true # release-surface, dependency firewall, offline deps, mock exclusion
run_simulation_tooling: true # vector/VCD/evidence-writer tests and generator drift

# Authenticated Wokwi execution.
#
# Leave false unless a fresh, never-exposed token is present in the process environment. When false the
# verify gate reports the Wokwi group as SKIPPED and refuses to mark execution-dependent tasks complete.
allow_authenticated_wokwi: false

# Directories the gate writes durable evidence to. Stub or control-flow tests MUST be redirected elsewhere
# (WOKWI_LOGS_DIR / WOKWI_VCD_DIR) so a real run's evidence is never overwritten.
evidence_logs_dir: target/wokwi-logs
evidence_vcd_dir: target/wokwi-vcd
