installed:
- kivori-gates
settings:
  auto_execute_hooks: true
hooks:
  after_tasks:
  - extension: kivori-gates
    command: speckit.kivori-gates.task-audit
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.kivori-gates.task-audit?
    description: Mandatory task-integrity audit
    condition: null
  before_implement:
  - extension: kivori-gates
    command: speckit.kivori-gates.preflight
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.kivori-gates.preflight?
    description: Mandatory implementation preflight
    condition: null
  after_implement:
  - extension: kivori-gates
    command: speckit.kivori-gates.verify
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.kivori-gates.verify?
    description: Mandatory full validation gate
    condition: null
  before_converge:
  - extension: kivori-gates
    command: speckit.kivori-gates.evidence-audit
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.kivori-gates.evidence-audit?
    description: Mandatory evidence audit before convergence
    condition: null
  after_converge:
  - extension: kivori-gates
    command: speckit.kivori-gates.release-gate
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.kivori-gates.release-gate?
    description: Mandatory release safety gate after convergence
    condition: null
