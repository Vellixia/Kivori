# Golden-frame manifest — frame-hash (FNV-1a over RGB565 little-endian bytes). Regenerate deliberately
# if the scene art or renderer changes (Principle III). Asserted by tests/golden.rs (code scene) and
# tests/asset_golden.rs (compiled asset scenes).
hash = "fnv1a-rgb565-le"
dimension = 240

# Phase 4 code-defined test scene.
[test_scene]
[[test_scene.frame]]
elapsed_ms = 0
hash = "0x911BC4B3FD4537A5"
[[test_scene.frame]]
elapsed_ms = 100
hash = "0x55251F6C652105A5"
[[test_scene.frame]]
elapsed_ms = 800 # loops to frame 0
hash = "0x911BC4B3FD4537A5"

