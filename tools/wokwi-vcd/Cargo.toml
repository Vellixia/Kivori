[package]
name = "kivori-wokwi-vcd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic VCD (logic-analyzer) checker for the Wokwi generic SPI display probe (host tool)."

[[bin]]
name = "kivori-wokwi-vcd"
path = "src/main.rs"

[lib]
name = "kivori_wokwi_vcd"
path = "src/lib.rs"

# No dependencies on purpose: a checker that gates CI evidence should have nothing to go stale under it.
[dependencies]
