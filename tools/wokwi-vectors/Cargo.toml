[package]
name = "kivori-wokwi-vectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Generates Wokwi automation byte vectors from the real kivori-protocol codec (host build tool)."

[[bin]]
name = "kivori-wokwi-vectors"
path = "src/main.rs"

[lib]
name = "kivori_wokwi_vectors"
path = "src/lib.rs"

[dependencies]
# Vectors are produced by the REAL codec — no wire-format constant is ever duplicated here.
kivori-model = { path = "../../crates/kivori-model" }
kivori-protocol = { path = "../../crates/kivori-protocol" }
heapless = "0.8"
