      <g fill="#fff"><ellipse cx="80" cy="123" rx="6.5" ry="7.5"/><ellipse cx="156" cy="123" rx="6.5" ry="7.5"/></g>
      <g fill="#9aa7b6"><circle cx="89" cy="140" r="2"/><circle cx="165" cy="140" r="2"/></g>
    </g>
    <g id="eyes-booting">
      <g fill="#02060c"><ellipse cx="82" cy="131" rx="12" ry="15"/><ellipse cx="158" cy="131" rx="12" ry="15"/></g>
      <g fill="#fff"><circle cx="79" cy="125" r="5"/><circle cx="155" cy="125" r="5"/></g>
