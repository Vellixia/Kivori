<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <title>Kivori — blue companion</title>
  <desc>Editable vector reconstruction of mascot.png. Body, shine, cheeks, eyes and mouths are independently named. No raster images or external resources.</desc>
  <defs>
