      <stop offset="0.38" stop-color="#098cff"/>
      <stop offset="0.78" stop-color="#0065f5"/>
      <stop offset="1" stop-color="#0342db"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.25" r="0.72">
      <stop offset="0" stop-color="#c5efff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#43aaff" stop-opacity="0"/>
