# Host CI (skeleton — expanded in Phase 14 / T110). Hardware-free and window-automation-free.
name: host
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  frontend-migration:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Generate base-nova shadcn primitives
        run: |
          cd apps/desktop
          bunx shadcn@4.21.0 add button card badge tabs separator slider toggle toggle-group scroll-area table --yes --overwrite
      - name: Format generated migration files
        run: bun x prettier --write apps/desktop/src/index.css apps/desktop/src/components/ui/*.tsx
      - name: Remove pnpm workspace files
        run: rm -f pnpm-lock.yaml pnpm-workspace.yaml
      - name: Commit migration artifacts to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bun.lock pnpm-lock.yaml pnpm-workspace.yaml apps/desktop/src/index.css apps/desktop/src/components/ui
          if git diff --cached --quiet; then
            echo "No migration artifacts changed."
          else
            git commit -m "build(frontend): lock Bun and add shadcn primitives"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The release feature-surface guard also builds the firmware library for the device target.
          targets: riscv32imc-unknown-none-elf
          components: rustfmt, clippy
      - name: Install Tauri v2 + serial system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Direct-dependency firewall (ADR-0001)
        run: bash scripts/check-crate-boundaries.sh
        shell: bash
      - name: Offline dependency guard (FR-029)
        run: bash scripts/check-offline-deps.sh
        shell: bash
      - name: Release feature-surface guard (T104, FR-028, ADR-0005)
        if: runner.os == 'Linux'
        run: bash scripts/check-release-surface.sh
        shell: bash

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Capture Bun lockfile for migration
        uses: actions/upload-artifact@v4
        with:
          name: bun-lock
          path: bun.lock
          if-no-files-found: error
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format
      - run: bun run test
      - run: bun run build
      - name: Frontend offline-asset guard (FR-029, SC-006)
        run: node scripts/check-frontend-offline.mjs
      - name: Production mock-exclusion guard (T124, FR-028)
        run: node scripts/check-mock-excluded.mjs

  windows-device-studio-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install
      - name: Build Device Studio frontend
        run: bun --filter kivori-desktop-ui build
      - name: Build Device Studio native binary
        run: cargo build -p kivori-desktop
      - name: Launch Device Studio and verify startup
        shell: powershell
        run: .\scripts\test-windows-device-studio-startup.ps1
