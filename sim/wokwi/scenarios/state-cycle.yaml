# Wokwi scenario: state application, the sendable boundary, and change-driven RGB565 tile rendering.
#
# Proves the canonical renderer runs on the target ISA and that a repeated identical frame flushes
# nothing. A render-loop stall or a missing StateReport times out => failure.
name: kivori-state-cycle
version: 1
author: Kivori
steps:
  - wait-serial: 'KIVORI-SIM BOOT firmware=kivori-firmware'
  # SetState is applied and reported back (FR-012).
  - wait-serial: 'KIVORI-SIM PASS setstate-applied'
  - wait-serial: 'KIVORI-SIM PASS statereport-emitted'
  # `booting`/`offline` are device-originated and cannot travel in a SetState payload (FR-014/FR-015).
  - wait-serial: 'KIVORI-SIM PASS sendable-excludes-device-states'
  - wait-serial: 'KIVORI-SIM PASS device-originated-states'
  # The compiled asset bundle is read at runtime (never source art; Constitution XI).
  - wait-serial: 'KIVORI-SIM PASS assets-parsed'
  # Canonical renderer -> thirty-six 40x40 RGB565 tiles with the expected geometry.
  - wait-serial: 'KIVORI-SIM PASS render-ok'
  - wait-serial: 'KIVORI-SIM PASS tile-count-36'
  - wait-serial: 'KIVORI-SIM PASS tile-geometry-rgb565'
  # Change-driven refresh: an identical frame flushes no tiles; a changed frame flushes all tiles (FR-013).
  - wait-serial: 'KIVORI-SIM PASS change-driven-no-reflush'
  - wait-serial: 'KIVORI-SIM PASS change-driven-reflush-on-change'
  # Device diagnostics carry only safe values (ADR-0005).
  - wait-serial: 'KIVORI-SIM PASS diagnostics-safe-health'
  - wait-serial: 'KIVORI-SIM PASS diagnostics-safe-pong'
  # Final verdict.
  - wait-serial: 'KIVORI-SIM ALL PASS'
