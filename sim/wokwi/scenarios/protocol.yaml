# Wokwi scenario: the protocol receive/transmit loop on real silicon-model hardware.
#
# The simulated host lives inside the firmware (Wokwi scenarios cannot inject serial input), but every
# frame is encoded/decoded by the real kivori-protocol codec and dispatched by the real device
# dispatcher. A missing handshake reply, a missing Pong, or a decode failure times out => failure.
name: kivori-protocol
version: 1
author: Kivori
steps:
  - wait-serial: 'KIVORI-SIM BOOT firmware=kivori-firmware'
  # Receive/transmit loop ran without a transport error.
  - wait-serial: 'KIVORI-SIM PASS protocol-poll-ok'
  # Hello -> HelloAck: nonce echoed, identity + capabilities advertised (FR-002/FR-003).
  - wait-serial: 'KIVORI-SIM PASS handshake-nonce-echo'
  - wait-serial: 'KIVORI-SIM PASS handshake-identity'
  - wait-serial: 'KIVORI-SIM PASS capability-advertised'
  # An unsupported protocol major is rejected with no reply at all.
  - wait-serial: 'KIVORI-SIM PASS version-reject-no-reply'
  # Heartbeat: Ping -> Pong echoing the host timestamp.
  - wait-serial: 'KIVORI-SIM PASS heartbeat-pong-echo'
  # Malformed frames: no panic, no side effect, and the next valid frame is still served (SC-008).
  - wait-serial: 'KIVORI-SIM PASS malformed-no-panic'
  - wait-serial: 'KIVORI-SIM PASS malformed-no-side-effect'
  - wait-serial: 'KIVORI-SIM PASS malformed-recovery'
